name: progress
on:
  push:
    branches: [rmke01-setup]
  pull_request:          # comments how each pull request changes progress

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # lets decmp.dev verify this run belongs to your repo
      pull-requests: write   # lets it comment on pull requests
    steps:
      - uses: actions/checkout@v5

      # The game files cannot be on CI, so the report is not built here: it is the
      # objdiff report of the last verified local build, committed by
      # tools/decomp/publish_report.py (names, sizes and match percentages only).
      # decmp's script form (decmp/upload-action@v1's action.yml failed to parse on
      # 2026-11-12); the download is pinned by its sha256 from decmp.dev/add.
      - name: Upload to decmp.dev
        run: |
          curl -fsSL https://api.decmp.dev/action/v1.1.0.mjs -o decmp.mjs
          echo "10fb0039a067b4ffe67510959356a691efa6efbb0aae16450c04f8c64da0a5f8  decmp.mjs" | sha256sum -c
          node decmp.mjs
        env:
          DECMP_REPORT: progress/RMKE01/report.json
          DECMP_VERSION: RMKE01
          GITHUB_TOKEN: ${{ github.token }}   # comments on pull requests
